version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: supradb
      MYSQL_USER: supraserver
      MYSQL_PASSWORD: change_me
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
